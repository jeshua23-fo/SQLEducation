<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · SQL Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="stage">
  <section class="card" aria-labelledby="title">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
    </div>
    <h1 id="title">LOGIN</h1>

    <form id="form" novalidate>
      <p class="alert" id="alert" role="alert" hidden></p>

      <label for="user" class="lbl">Username</label>
      <div class="field" data-for="user">
        <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5z"/></svg>
        <input id="user" name="user" type="text" placeholder="Ingresa tu usuario o correo" autocomplete="username" autocapitalize="off" spellcheck="false" aria-describedby="userErr" required>
      </div>
      <p class="err" id="userErr"></p>

      <label for="pass" class="lbl">Password</label>
      <div class="field" data-for="pass">
        <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></svg>
        <input id="pass" name="pass" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" aria-describedby="passErr" required>
        <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
        </button>
      </div>
      <p class="err" id="passErr"></p>

      <button type="submit" class="submit" id="submit"><span>Ingresar al sistema</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>
</main>
<script src="js/login.js"></script>
</body>
</html>
